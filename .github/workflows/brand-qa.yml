name: Brand refresh browser QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brand-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Responsive browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install isolated browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run responsive and interaction QA
        shell: bash
        run: |
          set -euo pipefail
          # Invoke Astro directly so this isolated visual check does not run
          # the repository's unrelated document-generation predev hook.
          ./node_modules/.bin/astro dev --host 127.0.0.1 --port 4173 --strictPort > /tmp/djphelix-brand-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat /tmp/djphelix-brand-qa-server.log
            exit 1
          fi

          node .github/scripts/brand-qa.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: djphelix-brand-qa
          path: brand-qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
