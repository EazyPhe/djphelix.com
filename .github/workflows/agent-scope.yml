name: Agent scope

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Enforce agent ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the trusted base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch proposed head for filename comparison only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --force origin \
            "pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Enforce lane ownership and detect open-PR overlaps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-agent-scope.mjs \
            --base "$BASE_SHA" \
            --head "refs/remotes/pull/${PR_NUMBER}/head" \
            --branch "$HEAD_REF" \
            --current-pr "$PR_NUMBER" \
            --require-overlap-check
